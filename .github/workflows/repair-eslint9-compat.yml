name: One-shot ESLint compatibility repair

on:
  push:
    branches:
      - fix/eslint9-compat

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[eslint9-lock-repaired]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/eslint9-compat

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Regenerate compatible ESLint dependency graph
        run: npm install --save-dev 'eslint@^9.39.5' --package-lock-only --legacy-peer-deps

      - name: Remove one-shot workflow
        run: rm .github/workflows/repair-eslint9-compat.yml

      - name: Commit deterministic dependency repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/repair-eslint9-compat.yml
          git diff --cached --exit-code && { echo "No dependency repair generated"; exit 1; } || true
          git commit -m "fix(deps): restore ESLint 9 plugin compatibility [eslint9-lock-repaired]"
          git push origin HEAD:fix/eslint9-compat
