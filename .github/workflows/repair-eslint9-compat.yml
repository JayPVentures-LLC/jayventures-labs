name: One-shot ESLint compatibility repair

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-eslint9-compat.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout merged main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Regenerate compatible ESLint dependency graph
        run: npm install --save-dev 'eslint@^9.39.5' --package-lock-only --legacy-peer-deps

      - name: Prepare governed repair branch
        shell: bash
        run: |
          set -euo pipefail
          git checkout -b fix/eslint9-compat-generated
          rm .github/workflows/repair-eslint9-compat.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/repair-eslint9-compat.yml
          git diff --cached --exit-code && { echo "No dependency repair generated"; exit 1; } || true
          git commit -m "fix(deps): restore ESLint 9 plugin compatibility"
          git push origin HEAD:fix/eslint9-compat-generated
