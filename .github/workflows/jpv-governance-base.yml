name: JPV Governance Base

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  governance:
    runs-on: windows-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Governance validation
        shell: pwsh
        run: |
          ./scripts/governance/validate-people-protection.ps1

      - name: Policy enforcement validation
        shell: pwsh
        run: |
          node ./scripts/jpv-policy-enforcement.cjs

      - name: Deployment freeze validation
        shell: pwsh
        run: |
          node ./scripts/governance/check-deployment-freeze.mjs
