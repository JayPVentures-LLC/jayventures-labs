name: JPV-OS Production Binding Readiness Receipt

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "JPV-OS Post-Merge Production Gate"
    types:
      - completed

permissions:
  contents: read

jobs:
  receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate production binding readiness receipt
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MEMBERSTACK_JWT_PUBLIC_KEY: ${{ secrets.MEMBERSTACK_JWT_PUBLIC_KEY }}
          AZURE_KEY_VAULT_URL: ${{ secrets.AZURE_KEY_VAULT_URL }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          set -euo pipefail
          state="READY"
          missing=()
          cloudflare_state="OPTIONAL_UNCHECKED"

          for name in MEMBERSTACK_JWT_PUBLIC_KEY AZURE_KEY_VAULT_URL AZURE_TENANT_ID AZURE_CLIENT_ID; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then state="WAITING_EXTERNAL_BINDING"; fi

          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            cloudflare_state="OPTIONAL_DEGRADED_MISSING_CREDENTIAL"
          else
            code=$(curl -sS -o /tmp/cf-token.json -w '%{http_code}' \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/user/tokens/verify" || true)
            if [ "$code" = "200" ] && [ "$(jq -r '.success // false' /tmp/cf-token.json)" = "true" ]; then
              cloudflare_state="OPTIONAL_READY"
            else
              cloudflare_state="OPTIONAL_DEGRADED_AUTH_REJECTED_HTTP_${code}"
            fi
          fi

          missing_json=""
          if [ "${#missing[@]}" -gt 0 ]; then
            missing_json=$(printf '"%s",' "${missing[@]}")
            missing_json="${missing_json%,}"
          fi

          cat > production-binding-readiness.json <<EOF
          {
            "system": "JPV-OS",
            "gate": "production-binding-readiness",
            "state": "$state",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "missing_release_critical_bindings": [$missing_json],
            "cloudflare_adapter_state": "$cloudflare_state",
            "cloudflare_release_critical": false,
            "entitlements_kv_strategy": "resolve-existing-or-provision-canonical-when-adapter-authenticated"
          }
          EOF
          cat production-binding-readiness.json

      - name: Upload readiness receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-binding-readiness-receipt
          path: production-binding-readiness.json
