name: Authority Accountability Inheritance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-inheritance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate canonical governance inheritance
        shell: pwsh
        run: |
          $path = '.jpv/governance-inheritance.json'
          if (-not (Test-Path $path)) { throw 'Missing canonical governance inheritance manifest.' }
          $m = Get-Content $path -Raw | ConvertFrom-Json
          if ($m.schema_version -ne '1.3') { throw 'Governance inheritance schema drift detected.' }
          if ($m.authority_repository -ne 'JayPVentures-LLC/jpv-governance') { throw 'Invalid governance authority repository.' }
          if ($m.authority_commit -ne 'e733f9cf2742750a3b7c27b48af169bf7860ed94') { throw 'Governance authority commit drift detected.' }
          if ('policies/AUTHORITY-ACCOUNTABILITY-COUPLING.md' -notin @($m.policies)) { throw 'Authority-accountability policy inheritance missing.' }
          if ($m.runtime_authority_repository -ne 'jaypVLabs/JPV-OS') { throw 'Invalid runtime authority repository.' }
          if ($m.runtime_authority_commit -ne '6212c25165285812051ff601d6385facb898bf71') { throw 'Runtime authority commit drift detected.' }
          if ('governance/standards/INVESTIGATIVE-EVIDENCE-PIPELINE-INVARIANT.md' -notin @($m.runtime_policies)) { throw 'Investigative evidence standard inheritance missing.' }
          if ('governance/contracts/investigative-evidence-pipeline.v1.json' -notin @($m.runtime_policies)) { throw 'Investigative evidence contract inheritance missing.' }
          if ('governance/policies/systemic-access-hygiene.v1.json' -notin @($m.runtime_policies)) { throw 'Systemic access hygiene policy inheritance missing.' }
          if ('.jpv/governance/systemic-access-hygiene-inheritance.v1.json' -notin @($m.local_inheritance)) { throw 'Local systemic access inheritance receipt missing.' }
          if ($m.required -ne $true -or $m.failure_mode -ne 'block') { throw 'Governance inheritance is not blocking.' }
          if ($m.invariants.entity_resolution_precedes_association -ne $true) { throw 'Entity resolution ordering invariant missing.' }
          if ($m.invariants.inference_distinct_from_fact -ne $true) { throw 'Inference/fact separation invariant missing.' }
          if ($m.invariants.uncertain_or_high_materiality_requires_review -ne $true) { throw 'Review routing invariant missing.' }
          if ($m.invariants.investigative_records_append_only -ne $true) { throw 'Append-only investigative record invariant missing.' }
          if ($m.invariants.systemic_access_hygiene_required -ne $true) { throw 'Systemic access hygiene invariant missing.' }
          if ($m.invariants.person_targeting_permitted -ne $false) { throw 'Person-targeting safeguard weakened.' }
          if ($m.invariants.runtime_access_enforcement_required_where_mutable -ne $true) { throw 'Mutable access runtime enforcement invariant missing.' }
          $systemic = Get-Content '.jpv/governance/systemic-access-hygiene-inheritance.v1.json' -Raw | ConvertFrom-Json
          if ($systemic.status -ne 'ENFORCED') { throw 'Systemic access inheritance is not enforced.' }
          if ($systemic.canonical_policy.baseline_commit -ne '6212c25165285812051ff601d6385facb898bf71') { throw 'Systemic access baseline drift detected.' }
          New-Item -ItemType Directory -Force receipts | Out-Null
          @{
            gate='authority-accountability-inheritance'
            result='passed'
            authority_commit=$m.authority_commit
            runtime_authority_commit=$m.runtime_authority_commit
            systemic_access_policy='governance/policies/systemic-access-hygiene.v1.json'
            investigative_contract='governance/contracts/investigative-evidence-pipeline.v1.json'
            verified_at=[DateTimeOffset]::UtcNow.ToString('o')
          } | ConvertTo-Json | Set-Content receipts/authority-accountability-inheritance.json
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: authority-accountability-inheritance-receipt
          path: receipts/authority-accountability-inheritance.json
          if-no-files-found: error
