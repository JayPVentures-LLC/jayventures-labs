name: JPV Security Inheritance Enforcement

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  security:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate security inheritance and scan tracked secrets
        shell: pwsh
        run: ./scripts/Test-JPVSecurityInheritance.ps1
      - name: Verify security execution visibility
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $headers=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $run=Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          if([string]$run.id -ne [string]$env:GITHUB_RUN_ID -or $run.repository.full_name -ne $env:GITHUB_REPOSITORY){throw 'JPV_SECURITY_VISIBILITY_GAP: current security execution identity is not observable'}
        env:
          GITHUB_TOKEN: ${{ github.token }}
