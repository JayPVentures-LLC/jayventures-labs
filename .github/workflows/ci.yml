name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch for bounded lock repair
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chore/inherit-investigative-evidence-pipeline-v1'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: chore/inherit-investigative-evidence-pipeline-v1

      - name: Checkout
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'chore/inherit-investigative-evidence-pipeline-v1'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Audit root dependency graph
        run: npm audit --audit-level=moderate

      - name: Regenerate enforcement lockfile for security repair
        run: npm --prefix operations/jpv_os_enforcement install --package-lock-only --ignore-scripts

      - name: Audit enforcement dependency graph
        run: npm --prefix operations/jpv_os_enforcement audit --audit-level=moderate

      - name: Commit regenerated enforcement lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chore/inherit-investigative-evidence-pipeline-v1'
        shell: bash
        run: |
          if git diff --quiet -- operations/jpv_os_enforcement/package-lock.json; then
            echo 'Enforcement lockfile already converged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add operations/jpv_os_enforcement/package-lock.json
          git commit -m 'fix(security): refresh enforcement lockfile'
          git push origin HEAD:chore/inherit-investigative-evidence-pipeline-v1

      - name: Run tests
        run: npm test

      - name: Run typecheck
        run: npm run typecheck

      - name: Validate flagship site packaging
        run: npm run deploy:dryrun:website

      - name: Validate entitlement worker packaging
        run: npm run deploy:dryrun:entitlement

      - name: Validate bookings worker packaging
        run: npm run deploy:dryrun:bookings

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
