name: deploy-website

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: deploy-website-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-website:
    runs-on: ubuntu-latest
    environment: cloudflare-production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check deployment freeze
        run: npm run governance:freeze-check

      - name: Verify Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Resolve or provision flagship entitlement KV
        id: entitlements_kv
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CANONICAL_KV_TITLE: jpv-entitlements-kv
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          list=$(curl --fail-with-body -sS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces?per_page=100")
          test "$(jq -r '.success' <<<"$list")" = "true" || { jq . <<<"$list"; exit 1; }

          id=$(jq -r --arg title "$CANONICAL_KV_TITLE" '.result[] | select(.title == $title) | .id' <<<"$list" | head -n1)
          if [ -z "$id" ]; then
            mapfile -t candidates < <(jq -r '.result[] | select(.title | test("entitlement"; "i")) | .id' <<<"$list")
            if [ "${#candidates[@]}" -eq 1 ]; then
              id="${candidates[0]}"
              echo "Reusing existing entitlement-like KV namespace."
            elif [ "${#candidates[@]}" -gt 1 ]; then
              echo "Multiple entitlement-like KV namespaces exist; refusing ambiguous binding."
              jq -r '.result[] | select(.title | test("entitlement"; "i")) | [.title,.id] | @tsv' <<<"$list"
              exit 1
            else
              created=$(curl --fail-with-body -sS -X POST "${auth[@]}" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" \
                --data "$(jq -nc --arg title "$CANONICAL_KV_TITLE" '{title:$title}')")
              test "$(jq -r '.success' <<<"$created")" = "true" || { jq . <<<"$created"; exit 1; }
              id=$(jq -r '.result.id' <<<"$created")
              echo "Provisioned canonical KV namespace: $CANONICAL_KV_TITLE"
            fi
          fi

          test -n "$id" && test "$id" != "null"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "Resolved ENTITLEMENTS_KV namespace." >> "$GITHUB_STEP_SUMMARY"

      - name: Inject flagship KV namespace
        shell: bash
        env:
          CLOUDFLARE_ENTITLEMENTS_KV_ID: ${{ steps.entitlements_kv.outputs.id }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ENTITLEMENTS_KV_ID"
          perl -0pi -e 's/YOUR_KV_NAMESPACE_ID/$ENV{CLOUDFLARE_ENTITLEMENTS_KV_ID}/g' apps/flagship-site/wrangler.toml

      - name: Verify KV namespace placeholder was replaced
        shell: bash
        run: |
          if grep -q 'YOUR_KV_NAMESPACE_ID' apps/flagship-site/wrangler.toml; then
            echo "Unreplaced KV namespace placeholder found in apps/flagship-site/wrangler.toml"
            exit 1
          fi

      - name: Validate website deploy config
        run: npm run validate:deploy:website

      - name: Deploy flagship website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config apps/flagship-site/wrangler.toml
