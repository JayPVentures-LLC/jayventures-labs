name: Security Autofix

on:
  push:
    branches:
      - security/remediate-alerts-2026-07-22
    paths:
      - .github/workflows/security-autofix.yml

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: security/remediate-alerts-2026-07-22
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Repair root dependency graph
        run: |
          npm install hono@^4.12.34 js-yaml@^5.2.2 --save
          npm pkg set overrides.brace-expansion='^5.0.9'
          npm pkg set overrides.fast-uri='^3.1.5'
          npm pkg set overrides.postcss='^8.5.23'
          npm install --package-lock-only
          npm audit fix --package-lock-only

      - name: Repair enforcement dependency graph
        run: |
          npm --prefix operations/jpv_os_enforcement install js-yaml@^5.2.2 --save
          npm --prefix operations/jpv_os_enforcement pkg set overrides.postcss='^8.5.23'
          npm --prefix operations/jpv_os_enforcement install --package-lock-only
          npm --prefix operations/jpv_os_enforcement audit fix --package-lock-only

      - name: Verify repaired graphs
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm --prefix operations/jpv_os_enforcement ci
          npm --prefix operations/jpv_os_enforcement audit --audit-level=moderate

      - name: Commit regenerated manifests and lockfiles
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json operations/jpv_os_enforcement/package.json operations/jpv_os_enforcement/package-lock.json
          if git diff --cached --quiet; then
            echo 'No dependency changes required.'
            exit 0
          fi
          git commit -m 'fix(security): regenerate patched dependency graphs'
          git push origin HEAD:security/remediate-alerts-2026-07-22

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
